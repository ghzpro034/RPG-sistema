# Evita que o Supabase grátis pause depois de 7 dias sem uso.
# Precisa dos secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions).
# A resposta é "sem permissão" (quem não está logado não lê nada), mas a consulta chega no banco e conta como uso.
name: keepalive
on:
  schedule:
    - cron: "0 12 */3 * *" # a cada 3 dias, 9h em Brasília
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o banco do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # tira espaços e quebras de linha que às vezes vêm junto ao colar o secret
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')
          chave=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$chave" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_PUBLISHABLE_KEY em Settings → Secrets and variables → Actions → aba Secrets (Repository secrets)."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL precisa começar com https:// (ex.: https://xxxx.supabase.co)"; exit 1 ;;
          esac
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$url/rest/v1/campanhas?select=id&limit=1" \
            -H "apikey: $chave")
          echo "Supabase respondeu $codigo"
          # 5xx ou sem resposta: o projeto pode estar pausado
          test "$codigo" -lt 500
