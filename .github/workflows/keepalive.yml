# Evita que o Supabase grátis pause depois de 7 dias sem uso. É a reserva: o batimento principal é o
# Vercel Cron diário (app/api/manter-vivo). Os dois chamam a função manter_vivo, que faz uma escrita de verdade.
# (A consulta antiga só recebia "sem permissão" e não contou como uso: o projeto pausou em novembro.)
# Precisa dos secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions).
name: keepalive
on:
  schedule:
    - cron: "0 12 */3 * *" # a cada 3 dias, 9h em Brasília
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o banco do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # tira espaços e quebras de linha que às vezes vêm junto ao colar o secret
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')
          chave=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$chave" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_PUBLISHABLE_KEY em Settings → Secrets and variables → Actions → aba Secrets (Repository secrets)."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL precisa começar com https:// (ex.: https://xxxx.supabase.co)"; exit 1 ;;
          esac
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "$url/rest/v1/rpc/manter_vivo" \
            -H "apikey: $chave" -H "Content-Type: application/json" \
            -d '{"p_origem":"github"}' || echo 000)
          echo "Supabase respondeu $codigo"
          if [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]; then exit 0; fi
          echo "::error::O batimento não funcionou ($codigo). Se for 000 ou 5xx, o projeto pode estar pausado: restaure em supabase.com/dashboard."
          exit 1
